# n8n — visual workflow automation.
#
# N8N_ENCRYPTION_KEY encrypts stored credentials. It is generated once and must
# never change afterwards: rotating it makes every saved credential
# undecryptable, so treat it as part of the data, not as config.
#
# WEBHOOK_URL must be the public URL — workflows hand it to third parties as the
# callback address, and a wrong value fails only when an external service calls
# back.
#
# SQLite, which keeps this a single service and makes it the quickest way to try
# n8n. It is also the reason not to run it this way for long: SQLite takes one
# writer, so this is pinned to a single replica on the one node holding the
# volume, and execution history accumulates in the same file the editor reads
# from. Deploy "n8n (PostgreSQL)" instead when the instance starts mattering.
services:
  n8n:
    image: n8nio/n8n:2.38.1
    environment:
      # Heap sized deliberately, not inferred from the cgroup limit.
      NODE_OPTIONS: --max-old-space-size=1536
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${PRIMARY_DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${PRIMARY_DOMAIN}/
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n-data:/home/node/.n8n
    x-meshploy:
      type: application
      deploy:
        port: 5678
        replicas: 1
        # The limit is a ceiling, not a reservation: only the request is held on
        # the node, so a generous limit costs nothing until it is used.
        #
        # It has to be generous because Node sizes V8's heap from the CGROUP
        # LIMIT, not from what the process needs. Measured at a 2Gi limit this
        # instance settles at ~330Mi -- but at 512Mi V8 caps old space near
        # 250MB, thrashes, and aborts with "Ineffective mark-compacts near heap
        # limit" once the editor loads. It aborts itself before the cgroup kills
        # it, so the pod is never even marked OOMKilled: it just exits 134 in a
        # loop, which reads like an application bug rather than a memory one.
        memory_request: 512Mi
        memory_limit: 2Gi
        cpu_request: 200m
        cpu_limit: 1000m

volumes:
  n8n-data:
