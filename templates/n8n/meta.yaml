id: n8n
name: n8n
description: Workflow automation — connect APIs and services with a visual editor.
category: application
version: 1.0.0
icon: logo.svg
links:
  website: https://n8n.io
  source: https://github.com/n8n-io/n8n
maintainers: [pritthishnath]

variables:
  - key: N8N_ENCRYPTION_KEY
    generate: hex32
  - key: PRIMARY_DOMAIN
    generate: subdomain
    expose:
      service: n8n
      port: 5678
