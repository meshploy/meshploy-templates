# Zot — an OCI-native container registry.
#
# ── AUTHENTICATION ───────────────────────────────────────────────────────────
#
# Zot's shipped config at /etc/zot/config.json has no authentication, and auth
# is configurable in that file and nowhere else. This template replaces it with
# a config that points at an htpasswd credential store, and writes that store as
# a second file. Both are meshploy config files: stored encrypted, projected
# into the container by subPath so they sit alongside what the image ships.
#
# ZOT_PASSWORD is generated per install; read it from the stack's Variables tab
# to run `docker login <host> -u admin`. ZOT_HTPASSWD is its bcrypt hash, and
# the hash is what the file holds — so the plaintext is never in the config
# file, the Kubernetes Secret, or the container.
#
# The plaintext does sit in the stack's variables, unencrypted, exactly as every
# other template's generated password does. Changing it there does NOT re-derive
# the hash: to rotate the credential, edit /etc/zot/htpasswd in the Config tab
# with a hash you generate yourself (`htpasswd -bBn admin <new>`).
#
# accessControl gives the one user full rights on every repository and leaves
# anonymous callers with none, so an unauthenticated pull returns 401 rather
# than the repository list. defaultPolicy is empty on purpose: an empty policy
# is no access, which is what anonymous should have on a registry with a public
# hostname.
#
# ── STORAGE ──────────────────────────────────────────────────────────────────
#
# rootDirectory has to match whatever the config says, and the config here is
# ours, so /var/lib/registry is a choice rather than an inherited constraint —
# kept because it is where the upstream image's default config points, so an
# existing install's volume keeps working. Images are the whole point of a
# registry: without this volume every push is lost on the next restart.
services:
  zot:
    image: ghcr.io/project-zot/zot:v2.1.20
    volumes:
      - zot-data:/var/lib/registry
    x-meshploy:
      type: application
      files:
        - path: /etc/zot/config.json
          content: |
            {
              "storage": { "rootDirectory": "/var/lib/registry" },
              "http": {
                "address": "0.0.0.0",
                "port": "5000",
                "compat": ["docker2s2"],
                "auth": { "htpasswd": { "path": "/etc/zot/htpasswd" } },
                "accessControl": {
                  "repositories": {
                    "**": {
                      "policies": [
                        { "users": ["admin"], "actions": ["read", "create", "update", "delete"] }
                      ],
                      "defaultPolicy": []
                    }
                  },
                  "adminPolicy": {
                    "users": ["admin"],
                    "actions": ["read", "create", "update", "delete"]
                  }
                }
              },
              "log": { "level": "info" }
            }
        - path: /etc/zot/htpasswd
          content: |
            admin:${ZOT_HTPASSWD}
      deploy:
        port: 5000
        replicas: 1
        # Zot is Go and modest at rest, but a push writes blobs through memory
        # and dedup/GC walks the store. The platform default ceiling is enough
        # for a small registry; the request reflects idle.
        memory_request: 256Mi
        memory_limit: 1Gi
        cpu_request: 100m
        cpu_limit: 1000m

volumes:
  zot-data:
