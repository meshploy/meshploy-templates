id: zot
name: Zot Registry
description: OCI-native container registry, with a generated admin credential and anonymous access denied.
category: application
version: 1.2.0
icon: logo.svg
links:
  website: https://zotregistry.dev
  source: https://github.com/project-zot/zot
maintainers: [pritthishnath]

variables:
  # Shown once at install. Log in with: docker login <host> -u admin
  - key: ZOT_PASSWORD
    generate: password
  # The bcrypt hash of ZOT_PASSWORD, written into /etc/zot/htpasswd. Derived,
  # so the plaintext is never what lands in the file.
  - key: ZOT_HTPASSWD
    generate: bcrypt(ZOT_PASSWORD)
  - key: PRIMARY_DOMAIN
    generate: subdomain
    expose:
      service: zot
      port: 5000
