# MinIO — S3-compatible object storage.
#
# Useful next to Meshploy itself: point a storage integration at this instance
# and service and volume backups land on hardware you own, rather than in
# someone else's bucket.
#
# The published route is the S3 **API** on 9000, because that is the endpoint
# integrations and clients talk to. The web console on 9001 is not published:
# templates currently expose one port, so add a second route to this service on
# 9001 if you want the console from a browser. Everything the console does can
# also be done with the `mc` client against the API.
#
# The root password is generated once and is the credential for the whole
# instance. Create a scoped access key for each consumer rather than handing the
# root pair to anything.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://${PRIMARY_DOMAIN}
    volumes:
      - minio-data:/data
    x-meshploy:
      type: application
      deploy:
        port: 9000
        replicas: 1

volumes:
  minio-data:
