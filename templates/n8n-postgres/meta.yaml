id: n8n-postgres
name: n8n (PostgreSQL)
description: Workflow automation backed by a managed PostgreSQL database.
category: application
version: 1.0.0
icon: logo.svg
links:
  website: https://n8n.io
  source: https://github.com/n8n-io/n8n
maintainers: [pritthishnath]

variables:
  - key: N8N_ENCRYPTION_KEY
    generate: hex32
  - key: DB_PASSWORD
    generate: password
  - key: PRIMARY_DOMAIN
    generate: subdomain
    expose:
      service: n8n
      port: 5678
