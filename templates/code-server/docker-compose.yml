# code-server — VS Code served over HTTP.
#
# The password is generated once and is the only thing between the internet and
# a shell on your node: the editor has a terminal. Treat this as a privileged
# workload and consider putting it on an internal route rather than a public
# subdomain.
#
# /config holds settings, extensions and the default workspace.
services:
  code-server:
    image: linuxserver/code-server:4.135.0
    environment:
      # Heap sized deliberately, not inferred from the cgroup limit.
      NODE_OPTIONS: --max-old-space-size=768
      PASSWORD: ${EDITOR_PASSWORD}
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      DEFAULT_WORKSPACE: /config/workspace
    volumes:
      - code-server-config:/config
    x-meshploy:
      type: application
      deploy:
        port: 8443
        replicas: 1
        # code-server is VS Code's server: a Node process plus extension hosts and
        # whatever language server the user opens. 512Mi is a working IDE that
        # dies when a project is loaded.
        memory_request: 512Mi
        memory_limit: 1Gi
        cpu_request: 200m
        cpu_limit: 1000m

volumes:
  code-server-config:
